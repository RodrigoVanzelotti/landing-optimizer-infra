apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: landing-optimizer
  labels: { app: ai }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai }
  template:
    metadata:
      labels: { app: ai }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai
          image: ghcr.io/landing-optimizer/ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: ai-secrets }
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '1', memory: '1Gi' }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: landing-optimizer
spec:
  selector: { app: ai }
  ports:
    - port: 80
      targetPort: 8000
