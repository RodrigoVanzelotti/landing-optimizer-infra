name: Deploy Google Cloud V1 (central infrastructure)
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    uses: RodrigoVanzelotti/personal-cloud-infrastructure/.github/workflows/deploy-landing-optimizer.yml@main
    with:
      component: ${{ inputs.component }}
